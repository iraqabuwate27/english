<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F7FD">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>英语补底</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
 color-scheme:light;
 --bg:#F3F7FD;--tx:#0B1524;--sub:#6B7A90;
 --acc:#0A6CFF;--acc2:rgba(10,108,255,.08);
 --line:rgba(16,44,88,.07);--fill:rgba(16,44,88,.045);
 --ok:#0E7C3A;--okbg:rgba(18,140,66,.10);
 --bad:#C62828;--badbg:rgba(214,45,32,.08);
 --r:24px;
 --sh:0 1px 1.5px rgba(13,38,76,.05),0 16px 36px -20px rgba(13,38,76,.30);
 --sh-sm:0 1px 1px rgba(13,38,76,.04),0 10px 22px -16px rgba(13,38,76,.32);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;min-height:100dvh;color:var(--tx);overflow-x:hidden;
 background:radial-gradient(900px 520px at 12% -8%,#E4EFFF 0%,rgba(228,239,255,0) 62%),
  radial-gradient(760px 460px at 104% 2%,#E9F2FF 0%,rgba(233,242,255,0) 58%),
  linear-gradient(178deg,#F7FAFF 0%,#F2F6FD 46%,#F5F8FE 100%);
 background-attachment:fixed;
 font:17px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC",system-ui,sans-serif;
 letter-spacing:-.011em;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:4px;padding:calc(11px + env(safe-area-inset-top)) 18px 11px;
 background:rgba(250,252,255,.85);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
 border-bottom:1px solid rgba(16,44,88,.055)}
header h1{font-size:17px;font-weight:650;margin:0;flex:1;letter-spacing:-.015em}
.back{border:0;background:none;color:var(--acc);padding:6px 8px 6px 0;margin-right:2px;display:flex;align-items:center;cursor:pointer}
.back svg{width:22px;height:22px}
main{max-width:620px;margin:0 auto;padding:18px 16px 108px;animation:in .36s cubic-bezier(.22,.61,.36,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{position:relative;padding:18px;margin-bottom:14px;border-radius:var(--r);
 background:linear-gradient(180deg,rgba(255,255,255,.94) 0%,rgba(255,255,255,.76) 100%);
 border:1px solid rgba(255,255,255,.92);
 box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.95)}
.muted{color:var(--sub);font-size:15px;line-height:1.55}
.center{text-align:center}
.hero{background:linear-gradient(158deg,#EAF2FF 0%,#F6FAFF 46%,#FFFFFF 100%);overflow:hidden}
.hero:after{content:"";position:absolute;right:-70px;top:-90px;width:230px;height:230px;border-radius:50%;
 background:radial-gradient(circle,rgba(10,108,255,.16),rgba(10,108,255,0) 68%);pointer-events:none}
.ht{font-size:21px;font-weight:700;letter-spacing:-.022em}
.hsub{color:var(--sub);font-size:14px;margin:3px 0 15px}
.brow{display:flex;align-items:center;gap:11px;font-size:14px;margin:10px 0}
.brow>span:first-child{width:34px;color:var(--sub)}
.bv{width:46px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;font-size:13px}
.bar{position:relative;flex:1;height:10px;border-radius:99px;overflow:hidden;
 background:linear-gradient(180deg,rgba(16,44,88,.085),rgba(16,44,88,.05));
 box-shadow:inset 0 1px 2px rgba(16,44,88,.10)}
.bar i{position:relative;display:block;height:100%;border-radius:99px;
 background:linear-gradient(180deg,#5AA6FF 0%,#0A6CFF 100%);
 box-shadow:0 3px 8px -2px rgba(10,108,255,.55),inset 0 1px 0 rgba(255,255,255,.45);
 transition:width .6s cubic-bezier(.22,.61,.36,1)}
.bar i:after{content:"";position:absolute;inset:0;border-radius:99px;
 background:linear-gradient(180deg,rgba(255,255,255,.4),rgba(255,255,255,0) 58%)}
.stats{display:flex;text-align:center}
.stats .st{flex:1}
.num{font-size:22px;font-weight:700;letter-spacing:-.02em}
.lb{font-size:12px;color:var(--sub);margin-top:1px}
.tip,.warn{display:flex;gap:11px;align-items:flex-start;font-size:15px;color:var(--sub);line-height:1.55}
.tip .ico,.warn .ico{flex:none;margin-top:1px}
.warn{color:#B4530A}
.tip{background:linear-gradient(180deg,rgba(234,243,255,.85),rgba(244,249,255,.7));box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.ico{display:inline-flex;align-items:center;justify-content:center;color:var(--acc)}
.ico svg{width:22px;height:22px}
.btn{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;margin-bottom:11px;
 border:1px solid rgba(255,255,255,.95);border-radius:18px;color:var(--tx);
 background:linear-gradient(180deg,#FFFFFF 0%,#FDFEFF 58%,#F8FBFF 100%);
 box-shadow:var(--sh-sm),inset 0 1px 0 #fff;
 font:inherit;font-size:17px;font-weight:500;text-align:left;cursor:pointer;
 transition:transform .22s cubic-bezier(.22,.61,.36,1),box-shadow .22s,filter .22s}
.btn:active{transform:scale(.972);box-shadow:0 1px 1px rgba(13,38,76,.05),inset 0 1px 0 #fff}
.btn .bt{display:flex;flex-direction:column;flex:1;min-width:0}
.btn .b1{font-size:16px;font-weight:600;letter-spacing:-.012em}
.btn .b2{font-size:13px;color:var(--sub);font-weight:400;margin-top:1px}
.btn .chev{display:flex;color:#9AA9BE}
.btn .chev svg{width:18px;height:18px}
.btn>svg{width:22px;height:22px;flex:none}
.btn.pri{justify-content:center;text-align:center;font-weight:650;color:#fff;
 border-color:rgba(255,255,255,.22);
 background:linear-gradient(180deg,#4A9BFF 0%,#0A6CFF 62%,#0A63F0 100%);
 box-shadow:0 16px 30px -16px rgba(10,108,255,.9),0 2px 6px -2px rgba(10,90,220,.35),inset 0 1px 0 rgba(255,255,255,.42)}
.btn.pri .ico{color:#fff}
.btn.ok{justify-content:center;text-align:center;font-weight:650;color:var(--ok);box-shadow:none;
 background:linear-gradient(180deg,rgba(18,140,66,.12),rgba(18,140,66,.07));border-color:rgba(18,140,66,.14)}
.btn.bad{justify-content:center;text-align:center;font-weight:650;color:var(--bad);box-shadow:none;
 background:linear-gradient(180deg,rgba(214,45,32,.10),rgba(214,45,32,.06));border-color:rgba(214,45,32,.12)}
.btn.ghost{justify-content:center;text-align:center;background:transparent;box-shadow:none;border-color:transparent;color:var(--sub)}
.btn.mid{justify-content:center;text-align:center}
.row2{display:flex;gap:10px}
.row2 .btn{margin-bottom:0}
.pill{display:inline-block;padding:4px 13px;border-radius:99px;font-size:13px;color:var(--sub);
 background:rgba(255,255,255,.85);border:1px solid rgba(255,255,255,.95);box-shadow:0 1px 2px rgba(13,38,76,.05);
 font-variant-numeric:tabular-nums}
.flash{text-align:center;padding:38px 18px 32px;min-height:248px;display:flex;flex-direction:column;
 justify-content:center;gap:5px;cursor:pointer;border-radius:28px;
 background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(255,255,255,.72));
 box-shadow:0 2px 2px rgba(13,38,76,.03),0 26px 50px -30px rgba(13,38,76,.45),inset 0 1px 0 #fff;
 transition:transform .22s cubic-bezier(.22,.61,.36,1)}
.flash:active{transform:scale(.988)}
.big{font-size:44px;font-weight:700;letter-spacing:-.028em;line-height:1.16;word-break:break-word}
.ipa{font-size:17px;color:var(--sub);letter-spacing:0}
.bigipa{font-size:25px;font-weight:600;color:var(--acc);letter-spacing:0}
.zh{font-size:24px;font-weight:650;color:var(--acc);margin-top:5px}
.hint{font-size:14px;color:var(--sub);margin-top:7px}
.iconbtn{display:flex;align-items:center;justify-content:center;width:52px;height:52px;margin:2px auto 18px;
 border:1px solid rgba(255,255,255,.95);border-radius:26px;color:var(--acc);cursor:pointer;
 background:linear-gradient(180deg,#FFFFFF,#F7FAFF);
 box-shadow:0 10px 22px -14px rgba(13,38,76,.5),inset 0 1px 0 #fff;transition:transform .2s}
.iconbtn:active{transform:scale(.93)}
.iconbtn svg{width:24px;height:24px}
.stem{font-size:18px;font-weight:600;line-height:1.55;margin-bottom:14px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:9px;border-radius:16px;
 border:1px solid rgba(16,44,88,.05);background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(247,250,255,.85));
 color:var(--tx);font:inherit;font-size:16px;cursor:pointer;
 box-shadow:0 1px 1px rgba(13,38,76,.03),inset 0 1px 0 #fff;
 transition:transform .18s,background .18s}
.opt:active{transform:scale(.985)}
.opt.ok{background:linear-gradient(180deg,rgba(18,140,66,.14),rgba(18,140,66,.08));border-color:rgba(18,140,66,.2);color:var(--ok);font-weight:650}
.opt.no{background:linear-gradient(180deg,rgba(214,45,32,.10),rgba(214,45,32,.06));border-color:rgba(214,45,32,.16);color:var(--bad)}
.inp{width:100%;padding:15px 16px;margin-bottom:10px;border-radius:16px;border:1px solid rgba(255,255,255,.95);
 background:linear-gradient(180deg,#FFFFFF,#FBFDFF);color:var(--tx);font:inherit;font-size:18px;
 box-shadow:inset 0 1px 2px rgba(16,44,88,.06),0 1px 0 #fff}
.inp:focus{outline:2px solid rgba(10,108,255,.55);outline-offset:-1px}
.fb{display:flex;gap:11px;align-items:flex-start;padding:14px 16px;border-radius:16px;margin-bottom:12px;font-size:15px}
.fb.good{background:linear-gradient(180deg,rgba(18,140,66,.14),rgba(18,140,66,.08));color:var(--ok)}
.fb.bad{background:linear-gradient(180deg,rgba(214,45,32,.11),rgba(214,45,32,.06));color:var(--bad)}
.fb .ico{color:inherit;flex:none;margin-top:1px}
.fb .ico svg{width:20px;height:20px}
.why{color:var(--sub);font-size:14px;margin-top:5px;line-height:1.55}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:11px 15px;border-radius:14px;
 border:1px solid rgba(16,44,88,.05);background:linear-gradient(180deg,#FFFFFF,#F7FAFF);color:var(--tx);
 font:inherit;font-size:16px;cursor:pointer;box-shadow:0 1px 1px rgba(13,38,76,.03),inset 0 1px 0 #fff}
.chip:active{transform:scale(.96)}
.chip svg{width:20px;height:20px;color:var(--acc)}
.slot{min-height:56px;border-radius:16px;padding:8px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
 background:rgba(16,44,88,.035);box-shadow:inset 0 1px 3px rgba(16,44,88,.06);border:1px dashed rgba(10,108,255,.22)}
.slot .chip{background:linear-gradient(180deg,rgba(10,108,255,.12),rgba(10,108,255,.07));
 border-color:rgba(10,108,255,.16);color:var(--acc);font-weight:600;box-shadow:none}
.ph{color:var(--sub);font-size:14px;padding:4px 6px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;max-width:620px;margin:0 auto;
 padding:7px 6px calc(7px + env(safe-area-inset-bottom));
 background:rgba(255,255,255,.92);backdrop-filter:blur(32px) saturate(200%);-webkit-backdrop-filter:blur(32px) saturate(200%);
 border-top:1px solid rgba(255,255,255,.9);box-shadow:0 -14px 36px -26px rgba(13,38,76,.5)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border:0;
 background:none;color:#8A98AC;font:inherit;font-size:10px;font-weight:500;cursor:pointer;transition:color .2s,transform .2s}
nav button:active{transform:scale(.94)}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--acc)}
.sec{font-size:13px;font-weight:600;color:var(--sub);margin:20px 6px 9px;letter-spacing:0}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.pc{border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:12px 2px 10px;text-align:center;
 background:linear-gradient(180deg,#FFFFFF,#F8FBFF);cursor:pointer;
 box-shadow:0 1px 1px rgba(13,38,76,.04),0 10px 20px -18px rgba(13,38,76,.5),inset 0 1px 0 #fff;
 transition:transform .18s}
.pc:active{transform:scale(.94)}
.pc.on{transform:scale(.93);box-shadow:0 0 0 2px rgba(10,108,255,.45),0 10px 20px -14px rgba(13,38,76,.5)}
.pc .s{display:block;font-size:18px;font-weight:600;letter-spacing:0}
.pc .w{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.tnum{flex:none;width:28px;height:28px;border-radius:14px;background:rgba(10,108,255,.09);color:var(--acc);
 display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.lesson .para{margin:0 0 12px;font-size:16px;line-height:1.65}
.lesson .para:last-child{margin-bottom:0}
.lesson b{color:var(--acc)}
.ex{display:block;background:linear-gradient(180deg,rgba(244,248,255,.95),rgba(250,252,255,.85));
 border:1px solid rgba(16,44,88,.045);border-radius:12px;padding:9px 13px;margin:0 0 10px;font-size:16px}
.ex i{display:block;font-style:normal;color:var(--sub);font-size:13px}
table.tb{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:10px}
table.tb td,table.tb th{border:1px solid rgba(16,44,88,.08);padding:6px 3px;text-align:center}
table.tb th{background:rgba(10,108,255,.05);font-weight:600}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(16,44,88,.055)}
.wrow:last-of-type{border-bottom:0}
.wrow .e{font-size:16px;font-weight:600}
.wrow .z{font-size:13px;color:var(--sub);margin-top:1px}
.done{color:var(--ok);font-weight:600}
.tips p{margin:0 0 8px;font-size:15px;line-height:1.58}
.tips p:last-child{margin:0}
.tips b{color:var(--acc)}
#modal{position:fixed;inset:0;z-index:60;display:none}
#modal.on{display:block}
.mask{position:absolute;inset:0;background:rgba(12,26,50,.20);
 backdrop-filter:blur(10px) saturate(120%);-webkit-backdrop-filter:blur(10px) saturate(120%);
 animation:fade .28s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:620px;padding:10px 20px calc(20px + env(safe-area-inset-bottom));
 background:rgba(255,255,255,.82);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);
 border-radius:30px 30px 0 0;border-top:1px solid rgba(255,255,255,.95);
 box-shadow:0 -24px 70px -24px rgba(13,38,76,.45);
 animation:up .36s cubic-bezier(.22,.61,.36,1)}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(16,44,88,.16);margin:4px auto 14px}
.sheet h3{margin:0 0 6px;font-size:19px;font-weight:700;letter-spacing:-.02em}
.sheet p{margin:0 0 18px;color:var(--sub);font-size:15px;line-height:1.55}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@supports (corner-shape:superellipse(1.6)){
 .card,.btn,.opt,.chip,.pc,.iconbtn,.inp,.slot,.pill,.fb,.flash,.ex,.tnum,.sheet{border-radius:22px;corner-shape:superellipse(1.65)}
 .pill,.bar,.bar i,.tnum{border-radius:99px;corner-shape:round}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="modal"><div class="mask" onclick="closeSheet()"></div><div class="sheet" id="sheet"></div></div>

{id:'be',t:'① be 动词 am / is / are',tag:'句子的骨架',

{id:'pl',t:'③ 名词单复数（一个 / 两个以上）',tag:'词形变化',

function pickVoice(){

 });

function other(arr,key,self,n){
 var out=[],used={},g=0;used[self]=1;
 while(out.length<n&&g++<400){
  var v=arr[Math.floor(Math.random()*arr.length)][key];
  if(!used[v]){used[v]=1;out.push(v)}
 }
 return out;
}
function mkChoice(stem,correct,others,why){
 var opts=shuffle([correct].concat(others));
 return {kind:'choice',stem:stem,opts:opts,a:opts.indexOf(correct),why:why};
}
function makeQ(kind,n){
 var all=allWords(),out=[];
 if(kind==='ipa2w'){
  var seenIpa={},uniq=[];
  all.forEach(function(w){if(!seenIpa[w.ipa]){seenIpa[w.ipa]=1;uniq.push(w)}});
  var ws=shuffle(uniq).slice(0,Math.min(n,uniq.length));
  ws.forEach(function(w){
   out.push(mkChoice('<span class="bigipa">'+esc(w.ipa)+'</span> 是哪个单词？',w.en,other(uniq,'en',w.en,3),w.ipa+' = '+w.en+' '+w.zh));
  });
  return out;
 }
 if(kind==='w2ipa'){
  var seen2={},u2=[];
  all.forEach(function(w){if(!seen2[w.ipa]){seen2[w.ipa]=1;u2.push(w)}});
  shuffle(u2).slice(0,Math.min(n,u2.length)).forEach(function(w){
   out.push(mkChoice('<b>'+esc(w.en)+'</b> 的音标是？',w.ipa,other(u2,'ipa',w.ipa,3),w.en+' '+w.ipa+' '+w.zh));
  });
  return out;
 }
 var words=shuffle(all).slice(0,n);
 if(kind==='en2zh'){
  words.forEach(function(w){out.push(mkChoice('<b>'+esc(w.en)+'</b> '+esc(w.ipa)+' 是什么意思？',w.zh,other(all,'zh',w.zh,3),w.en+' = '+w.zh))});
 }else if(kind==='zh2en'){
  words.forEach(function(w){out.push(mkChoice('「'+esc(w.zh)+'」用英语怎么说？',w.en,other(all,'en',w.en,3),w.en+' = '+w.zh))});
 }else if(kind==='spell'){
  words.forEach(function(w){
   var hint=w.en.replace(/[A-Za-z]/g,function(c,i){return i===0?c:'_'});
   out.push({kind:'type',stem:'写出英语：'+esc(w.zh),ans:w.en,hint:hint+'　'+w.ipa,why:w.en+' '+w.ipa+' = '+w.zh});
  });
 }else if(kind==='order'){
  shuffle(SENT).slice(0,n).forEach(function(p){out.push(mkOrder(p))});
 }else if(kind==='trans'){
  shuffle(SENT).slice(0,n).forEach(function(p){
   var others=other(SENT.map(function(x){return {e:x[0]}}),'e',p[0],3);
   out.push(mkChoice('「'+esc(p[1])+'」的英语是？',p[0],others,p[0]+' = '+p[1]));
  });
 }
 return out;
}
function mkOrder(p){
 var answer=p[0].split(' '),tokens=shuffle(answer),g=0;
 while(tokens.join(' ')===answer.join(' ')&&g++<30)tokens=shuffle(answer);
 return {kind:'order',stem:'连词成句：'+esc(p[1]),tokens:tokens,answer:answer,why:p[0]};
}
function mixQ(n){
 var pool=[].concat(makeQ('en2zh',2),makeQ('zh2en',1),makeQ('spell',1),makeQ('order',1),makeQ('trans',1),makeQ('ipa2w',1));
 var learn=LESSONS[Math.floor(Math.random()*LESSONS.length)];
 var lq=learn.qs.map(function(x){var o=x[1].split('|');return {kind:'choice',stem:x[0],opts:o,a:x[2],why:x[3]}});
 pool=pool.concat(shuffle(lq).slice(0,2));
 return shuffle(pool).slice(0,n);
}
function drill(kind){
 var list=kind==='mix'?mixQ(8):makeQ(kind,8);
 quizStart(list,kind==='mix'?'混合练习':'练习',function(){});
}

/* ---------- 答题 ---------- */
function quizStart(list,title,onDone){
 if(!list||!list.length){alert('题库准备中');return}
 QZ={list:list,i:0,right:0,wrong:0,title:title,onDone:onDone,answered:false,chosen:-1,sel:[],typed:'',lastOK:false};
 view('quiz');
}
function quizHTML(){
 if(!QZ)return practiceHTML();
 if(QZ.i>=QZ.list.length)return quizDoneHTML();
 var q=QZ.list[QZ.i],i=QZ.i,body='';
 if(q.kind==='choice'){
  body=q.opts.map(function(o,j){
   var cls='opt';
   if(QZ.answered){if(j===q.a)cls+=' ok';else if(j===QZ.chosen)cls+=' no'}
   return '<button class="'+cls+'" onclick="ansChoice('+j+')">'+esc(o)+'</button>'
  }).join('');
 }else if(q.kind==='type'){
  body='<input id="tin" class="inp" autocomplete="off" autocapitalize="off" spellcheck="false" '+(QZ.answered?'disabled value="'+esc(QZ.typed)+'"':'')+' placeholder="在这里写出英语">'
  +(q.hint?'<div class="ph">提示：'+esc(q.hint)+'</div>':'')
  +(QZ.answered?'':'<button class="btn pri" style="margin-top:12px" onclick="checkTypeQ()">提交</button>');
 }else if(q.kind==='order'){
  var chosen=QZ.sel.map(function(j){return q.tokens[j]}),rest='';
  q.tokens.forEach(function(t,j){if(QZ.sel.indexOf(j)<0)rest+='<button class="chip" onclick="pickTok('+j+')">'+esc(t)+'</button>'});
  body='<div class="slot">'+(chosen.length?chosen.map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join(''):'<span class="ph">按顺序点下面的词</span>')+'</div>'
  +'<div class="chips">'+rest+'</div>'
  +(QZ.answered?'':'<div class="row2"><button class="btn ghost" onclick="clearTok()">清空</button><button class="btn pri" onclick="checkOrderQ()">检查</button></div>');
 }
 var fb='';
 if(QZ.answered){
  var ok=(q.kind==='choice')?(QZ.chosen===q.a):QZ.lastOK;
  fb='<div class="fb '+(ok?'good':'bad')+'">'+ic(ok?'check':'x')+'<div><div>'+(ok?'答对了':'再记一次')+'</div>'
   +(q.kind==='choice'?'':'<div style="margin-top:2px">正确答案：<b>'+esc(ansText(q))+'</b></div>')
   +'<div class="why">'+esc(q.why)+'</div></div></div>'
   +'<button class="btn pri" onclick="nextQ()">下一题</button>';
 }
 return hdr(QZ.title,'quizExit()')+'<main>'
 +'<div class="center" style="margin-bottom:10px"><span class="pill">'+(i+1)+' / '+QZ.list.length+' · 对 '+QZ.right+'</span></div>'
 +'<div class="card"><div class="stem">'+q.stem+'</div>'+body+'</div>'+fb+'</main>';
}
function ansText(q){
 if(q.kind==='choice')return q.opts[q.a];
 if(q.kind==='type')return q.ans;
 if(q.kind==='order')return q.answer.join(' ');
 return '';
}
function record(ok){
 if(ok)QZ.right++;else{QZ.wrong++;addWrongQ(QZ.list[QZ.i])}
 S.today.prac++;saveS();
}
function ansChoice(j){if(QZ.answered)return;QZ.chosen=j;QZ.answered=true;record(j===QZ.list[QZ.i].a);render()}
function norm(s){return String(s).toLowerCase().replace(/\s+/g,' ').trim().replace(/[.。!！?？]/g,'')}
function checkTypeQ(){
 var v=document.getElementById('tin').value;
 if(!v.trim())return;
 QZ.typed=v.trim();
 var ok=norm(v)===norm(QZ.list[QZ.i].ans);
 QZ.answered=true;QZ.lastOK=ok;record(ok);render();
}
function pickTok(j){if(QZ.answered)return;QZ.sel.push(j);render()}
function clearTok(){if(QZ.answered)return;QZ.sel=[];render()}
function checkOrderQ(){
 var q=QZ.list[QZ.i],got=QZ.sel.map(function(j){return q.tokens[j]}).join(' ');
 var ok=norm(got)===norm(q.answer.join(' '));
 QZ.answered=true;QZ.lastOK=ok;record(ok);render();
}
function nextQ(){QZ.i++;QZ.answered=false;QZ.chosen=-1;QZ.sel=[];QZ.typed='';QZ.lastOK=false;render();window.scrollTo(0,0)}
function quizExit(){if(QZ&&QZ.onDone)QZ.onDone();view('practice')}
function quizDoneHTML(){
 if(QZ&&QZ.onDone)QZ.onDone();
 var n=QZ.list.length,r=QZ.right;
 var msg=r===n?'全对，今天这一组很稳。':(r>=n*0.7?'不错，错的题已经进错题本。':'错的有点多，别急，回错题本再看一遍。');
 return hdr('完成')+'<main><div class="card center">'
 +'<div class="num" style="font-size:32px">'+r+' / '+n+'</div>'
 +'<div class="muted" style="margin:6px 0 18px">'+msg+'</div>'
 +'<button class="btn pri" onclick="view(\'wrong\')">看错题本</button>'
 +'<button class="btn ghost" onclick="quizExit()">回练习</button>'
 +'</div></main>';
}

/* ---------- 错题 ---------- */
function addWrongQ(q){
 for(var i=0;i<S.wrongQ.length;i++){if(S.wrongQ[i].stem===q.stem)return}
 S.wrongQ.push(JSON.parse(JSON.stringify(q)));
}
function wrongHTML(){
 var qs=S.wrongQ,ws=S.wrongW,body='';
 if(!qs.length&&!ws.length){
  body='<div class="card center"><div class="muted">还没有错题。去做几道练习，错题会自动收进来。</div></div>';
 }else{
  if(ws.length){
   body+='<div class="card"><div style="font-weight:650;margin-bottom:2px">单词 · '+ws.length+' 个</div>'
   +ws.map(function(w){return '<div class="wrow"><div><div class="e">'+esc(w.en)+'</div><div class="z">'+esc(w.ipa||'')+'　'+esc(w.zh)+'</div></div><button class="chip" onclick="speak(\''+esc(w.en)+'\')">'+IC.sound+'</button></div>'}).join('')
   +'<button class="btn pri" style="margin-top:12px" onclick="redoWords()">重背这些词</button></div>';
  }
  if(qs.length){
   body+='<div class="card"><div style="font-weight:650;margin-bottom:2px">题目 · '+qs.length+' 道</div>'
   +qs.map(function(q){return '<div class="wrow"><div><div class="e" style="font-weight:500;font-size:15px">'+q.stem+'</div><div class="z">正确答案：'+esc(ansText(q))+'</div></div></div>'}).join('')
   +'<button class="btn pri" style="margin-top:12px" onclick="redoQs()">重做这些题</button></div>';
  }
 }
 var h=hdr('错题本')+'<main>'+body;
 if(qs.length||ws.length)h+='<button class="btn ghost" onclick="clearWrong()">清空错题本</button>';
 h+='<div class="card muted" style="font-size:13px">今天做错的题，明天早上再看一遍。连续 3 天都对，这个知识点就算过关了。</div>';
 return h+'</main>';
}
function redoWords(){
 var list=shuffle(S.wrongW).slice(0,10).map(function(w){return {en:w.en,zh:w.zh,ipa:w.ipa}});
 WS={list:list,i:0,rev:false,known:0,gi:-1};
 view('wordrun');
}
function redoQs(){quizStart(shuffle(S.wrongQ).slice(0,10),'重做错题',function(){})}
var SHEETOK=null;
function openSheet(title,text,okText,onOk){
 SHEETOK=onOk||null;
 document.getElementById('sheet').innerHTML='<div class="grab"></div><h3>'+esc(title)+'</h3><p>'+esc(text)+'</p>'
  +'<div class="row2"><button class="btn" onclick="closeSheet()">取消</button>'
  +'<button class="btn bad" onclick="sheetOk()">'+esc(okText||'确定')+'</button></div>';
 document.getElementById('modal').classList.add('on');
}
function closeSheet(){document.getElementById('modal').classList.remove('on');SHEETOK=null}
function sheetOk(){var f=SHEETOK;closeSheet();if(f)f()}
function clearWrong(){
 openSheet('清空错题本','错题和标记的单词会被删除，学习进度不受影响。','清空',function(){
   S.wrongQ=[];S.wrongW=[];saveS();render();
 });
}

/* 轻触反馈：手机上点按钮时给一点震动 */
document.addEventListener('click',function(e){
 var t=e.target&&e.target.closest?e.target.closest('button'):null;
 if(t&&navigator.vibrate){try{navigator.vibrate(6)}catch(_){}}
},true);

/* PWA：装到桌面 + 离线可用（只在 https 下生效） */
try{
 if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(function(){});
 }
}catch(e){}

render();
</script>
</body>
</html>
